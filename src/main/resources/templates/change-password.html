<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head-content}"></head>

<body class="bg-gray-900 text-gray-200 flex min-h-screen">

<div th:replace="~{fragments/sidebar :: sidebar('settings')}"></div>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="max-w-2xl mx-auto">

        <div class="flex items-center mb-8">
            <a th:href="@{/settings}" class="mr-4 p-2 rounded-full hover:bg-gray-800 text-gray-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <h2 class="text-3xl font-bold text-white">Change Password</h2>
        </div>

        <div class="bg-gray-800/50 rounded-xl p-8 border border-gray-700/50 shadow-lg">

            <div th:if="${errorMessage}" class="mb-6 p-4 rounded-lg bg-red-900/50 border border-red-800 text-red-200 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/settings/password}" th:object="${changePasswordDTO}" method="post" class="space-y-6">

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Current Password</label>
                    <input type="password" th:field="*{currentPassword}"
                           class="w-full bg-gray-900/50 border border-gray-600 text-white rounded-lg focus:ring-purple-500 focus:border-purple-500 p-3">
                    <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="mt-1 text-sm text-red-400"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">New Password</label>
                    <input type="password" th:field="*{newPassword}"
                           class="w-full bg-gray-900/50 border border-gray-600 text-white rounded-lg focus:ring-purple-500 focus:border-purple-500 p-3">
                    <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-1 text-sm text-red-400"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Confirm New Password</label>
                    <input type="password" th:field="*{confirmPassword}"
                           class="w-full bg-gray-900/50 border border-gray-600 text-white rounded-lg focus:ring-purple-500 focus:border-purple-500 p-3">
                    <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-1 text-sm text-red-400"></p>
                </div>

                <div class="pt-4 flex justify-end space-x-4">
                    <a th:href="@{/settings}" class="px-6 py-3 rounded-lg border border-gray-600 text-gray-300 hover:bg-gray-700 font-medium transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-3 rounded-lg bg-purple-600 hover:bg-purple-700 text-white font-medium shadow-lg shadow-purple-900/20 transition-colors">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
