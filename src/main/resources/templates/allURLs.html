<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head-content}"></head>

<body class="bg-gray-900 text-gray-200 flex min-h-screen">

<div th:replace="~{fragments/sidebar :: sidebar('monitored')}"></div>

<div id="toast-container" class="fixed top-5 right-5 z-50 space-y-4"></div>

<main class="flex-1 p-8 overflow-y-auto">

    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-white">Monitored Services</h2>
    </div>

    <div class="bg-gray-800/50 rounded-xl p-6 mb-8 border border-gray-700/50 shadow-lg">
        <h4 class="text-lg font-bold text-white mb-4">Add New Service</h4>

        <form th:action="@{/monitored/add}" method="post" class="space-y-4">

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-3">
                    <input type="text" name="name" placeholder="Service Name (e.g. Google or Database)" required
                           class="w-full bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block p-2.5">
                </div>

                <div>
                    <select name="type" id="serviceType" onchange="toggleFormFields()"
                            class="w-full bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block p-2.5">
                        <option value="HTTP">HTTP / Website</option>
                        <option value="TCP">TCP / Port</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-3">
                    <input type="url" name="link" id="addressInput" placeholder="URL (e.g. https://google.com)" required
                           class="w-full bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block p-2.5">
                </div>

                <div id="portField" class="hidden">
                    <input type="number" name="port" placeholder="Port (e.g. 27017)"
                           class="w-full bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block p-2.5">
                </div>

                <div class="md:col-span-1">
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-lg transition-colors">
                        Add Service
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="bg-gray-800/50 rounded-xl shadow-lg overflow-hidden border border-gray-700/50">
        <table class="min-w-full divide-y divide-gray-700/50">
            <thead class="bg-gray-800/60">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">
                    Status
                </th>

                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">
                    Service Name
                </th>

                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-300 uppercase tracking-wider">
                    URL / Address
                </th>

                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-300 uppercase tracking-wider">
                    Interval
                </th>

                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-300 uppercase tracking-wider">
                    Monitoring
                </th>

                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-300 uppercase tracking-wider">
                    Actions
                </th>
            </tr>
            </thead>

            <tbody class="divide-y divide-gray-700/50">
            <tr th:each="dto : ${statusList}" class="hover:bg-gray-700/30 transition-colors duration-150" th:id="'row-' + ${dto.monitored.id}">

                <td class="px-6 py-4 whitespace-nowrap">
                    <div th:with="isStopped=${!dto.monitored.beingMonitored},
                                  isUp=${dto.monitored.beingMonitored and dto.status == 200}">

                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border"
                              th:classappend="${isStopped} ? 'bg-gray-700/30 text-gray-400 border-gray-600'
                                            : (${isUp} ? 'bg-green-900/30 text-green-400 border-green-800'
                                            : 'bg-red-900/30 text-red-400 border-red-800')">

                            <span class="w-1.5 h-1.5 mr-1.5 rounded-full"
                                  th:classappend="${isStopped} ? 'bg-gray-400'
                                                : (${isUp} ? 'bg-green-400 animate-pulse'
                                                : 'bg-red-400 animate-pulse')"></span>

                            <span th:text="${isStopped} ? 'Stopped' : (${isUp} ? 'Live' : 'Down')">Stopped</span>
                        </span>
                    </div>
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-white text-sm font-medium">
                    <span th:text="${dto.monitored.name}">Name</span>
                    <span th:if="${dto.monitored.type == 'TCP'}" class="ml-2 text-[10px] bg-blue-900/50 text-blue-300 px-1 rounded border border-blue-800">TCP</span>
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-400">
                    <a th:href="${dto.monitored.link}" target="_blank" class="hover:text-purple-400 transition-colors truncate block max-w-[200px]" th:text="${dto.monitored.link}"></a>
                </td>

                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="flex justify-center items-center"
                         th:with="currentInterval=${dto.monitored.interval != null ? dto.monitored.interval : 30},
                                  isHour=${currentInterval % 3600 == 0},
                                  isMin=${!isHour and currentInterval % 60 == 0},
                                  displayVal=${isHour ? currentInterval / 3600 : (isMin ? currentInterval / 60 : currentInterval)},
                                  unitVal=${isHour ? 3600 : (isMin ? 60 : 1)}">

                        <div class="relative flex rounded-md shadow-sm w-36">

                            <input type="number" min="1"
                                   th:value="${displayVal}"
                                   th:disabled="${dto.monitored.beingMonitored}"
                                   class="row-interval-value block w-full rounded-l-md border-0 bg-gray-700/50 py-1.5 pl-3 pr-2 text-white ring-1 ring-inset ring-gray-600 placeholder:text-gray-400 focus:z-10 focus:ring-2 focus:ring-inset focus:ring-purple-500 sm:text-sm sm:leading-6 text-right appearance-none disabled:cursor-not-allowed disabled:opacity-50 transition-all">

                            <div class="relative -ml-px flex-shrink-0">
                                <select th:disabled="${dto.monitored.beingMonitored}"
                                        class="row-interval-unit block w-full rounded-r-md border-0 bg-gray-800 py-1.5 pl-2 pr-7 text-gray-300 ring-1 ring-inset ring-gray-600 focus:z-10 focus:ring-2 focus:ring-inset focus:ring-purple-500 sm:text-sm sm:leading-6 disabled:cursor-not-allowed disabled:opacity-50 hover:bg-gray-700 transition-colors cursor-pointer appearance-none">
                                    <option value="1" th:selected="${unitVal == 1}">s</option>
                                    <option value="60" th:selected="${unitVal == 60}">min</option>
                                    <option value="3600" th:selected="${unitVal == 3600}">hr</option>
                                </select>

                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
                                    <svg class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 15L12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9" />
                                    </svg>
                                </div>
                            </div>

                            <div th:if="${dto.monitored.beingMonitored}"
                                 class="absolute -top-2.5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-purple-400 text-[10px] px-1.5 py-0.5 rounded-full border border-gray-700 shadow-sm z-20 flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                                <span class="font-bold">Active</span>
                            </div>
                        </div>
                    </div>
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-center">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" class="sr-only peer monitor-toggle"
                               th:checked="${dto.monitored.beingMonitored}"
                               th:data-id="${dto.monitored.id}">
                        <div class="w-11 h-6 bg-gray-700 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-purple-800 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
                    </label>
                </td>

                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                    <a th:href="@{/monitored/edit/{id}(id=${dto.monitored.id})}"
                       class="text-gray-400 hover:text-white transition-colors text-xs font-semibold hover:underline">
                        Edit
                    </a>
                    <span class="text-gray-600">|</span>
                    <form th:action="@{/monitored/delete/{id}(id=${dto.monitored.id})}" method="post" class="inline">
                        <button type="submit" class="text-red-400 hover:text-red-300 transition-colors text-xs font-semibold hover:underline">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</main>

<style>
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type=number] {
        -moz-appearance: textfield;
    }
</style>

<script th:inline="javascript">
    const csrfHeaderName = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    const csrfToken = /*[[${_csrf.token}]]*/ '';
</script>

<script>
    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColor = isError ? 'bg-red-900/90 border-red-700' : 'bg-green-900/90 border-green-700';
        const textColor = isError ? 'text-red-200' : 'text-green-200';

        toast.className = `flex items-center p-4 mb-4 rounded-lg border ${bgColor} ${textColor} shadow-lg transition-all duration-500 transform translate-x-full`;
        toast.innerHTML = `
            <div class="ml-3 text-sm font-medium">${message}</div>
            <button type="button" class="ml-auto -mx-1.5 -my-1.5 rounded-lg p-1.5 inline-flex h-8 w-8 text-gray-300 hover:text-white focus:ring-2 focus:ring-gray-300" onclick="this.parentElement.remove()">
                <span class="sr-only">Close</span>
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
            </button>
        `;

        container.appendChild(toast);
        setTimeout(() => toast.classList.remove('translate-x-full'), 100);
        setTimeout(() => {
            toast.classList.add('translate-x-full', 'opacity-0');
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    function toggleFormFields() {
        const type = document.getElementById('serviceType').value;
        const portField = document.getElementById('portField');
        const addressInput = document.getElementById('addressInput');

        if (type === 'TCP') {
            portField.classList.remove('hidden');
            addressInput.placeholder = "IP Address";
        } else {
            portField.classList.add('hidden');
            addressInput.placeholder = "URL (https://...)";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll(".monitor-toggle").forEach(toggle => {
            toggle.addEventListener("change", function () {
                const id = this.getAttribute("data-id");
                const isChecked = this.checked;
                const row = document.getElementById('row-' + id);

                let url;

                if (!isChecked) {
                    url = `/task/remove/${id}`;
                } else {
                    const val = row.querySelector('.row-interval-value').value;
                    const unit = row.querySelector('.row-interval-unit').value;
                    const totalDelay = parseInt(val) * parseInt(unit);
                    url = `/task/allow/${id}?delay=${totalDelay}`;
                }

                this.disabled = true;

                fetch(url, {
                    method: 'PATCH',
                    headers: { [csrfHeaderName]: csrfToken }
                })
                    .then(async response => {
                        if (response.ok) {
                            showToast(isChecked ? "Monitoring started" : "Monitoring stopped");
                            setTimeout(() => location.reload(), 1000);
                        } else {
                            this.checked = !isChecked;
                            const errorData = await response.json().catch(() => ({}));
                            const msg = errorData.message || "Failed to update status (Check limits)";
                            showToast(msg, true);
                            this.disabled = false;
                        }
                    })
                    .catch(error => {
                        this.checked = !isChecked;
                        showToast("Network Error", true);
                        this.disabled = false;
                    });
            });
        });
    });
</script>

</body>
</html>
