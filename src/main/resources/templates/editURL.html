<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head-content}"></head>

<body class="bg-gray-900 text-gray-200 flex min-h-screen">

<div th:replace="~{fragments/sidebar :: sidebar('monitored')}"></div>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-white">Edit Service</h2>
    </div>

    <div class="bg-gray-800/50 rounded-xl p-8 border border-gray-700/50 shadow-lg max-w-2xl">

        <form th:action="@{/monitored/update/{id}(id=${id})}" th:object="${monitored}" method="post" class="space-y-6">

            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Service Name</label>
                <input type="text" th:field="*{name}" required
                       class="bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5">
            </div>

            <div>
                <label class="block mb-2 text-sm font-medium text-gray-300">Service URL</label>
                <input type="url" th:field="*{link}" required
                       class="bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5">
            </div>

            <div class="flex items-center space-x-4 pt-4">
                <button type="submit" class="text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:outline-none focus:ring-purple-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                    Save Changes
                </button>

                <a th:href="@{/monitored}" class="text-gray-300 bg-gray-700 hover:bg-gray-600 focus:ring-4 focus:outline-none focus:ring-gray-600 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
