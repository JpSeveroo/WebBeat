<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-content}"></head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex">

<div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-gray-900">
    <div class="w-full max-w-md space-y-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">Welcome back</h2>
            <p class="mt-2 text-sm text-gray-400">
                Sign in to your account to continue monitoring
            </p>
        </div>

        <div th:if="${successMessage}" class="p-4 mb-4 text-sm text-green-200 rounded-lg bg-green-900/50 border border-green-800" role="alert">
            <span class="font-medium">Success!</span> <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${param.error}" class="p-4 mb-4 text-sm text-red-200 rounded-lg bg-red-900/50 border border-red-800" role="alert">
            <span class="font-medium">Error!</span> Invalid email or password.
        </div>

        <div th:if="${errorMessage}" class="p-4 mb-4 text-sm text-red-200 rounded-lg bg-red-900/50 border border-red-800" role="alert">
            <span class="font-medium">Error!</span> <span th:text="${errorMessage}"></span>
        </div>

        <form class="mt-8 space-y-6" th:action="@{/auth/login}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300">Email address</label>
                    <div class="mt-1">
                        <input id="username" name="username" type="email" autocomplete="email" required
                               class="block w-full rounded-lg border border-gray-600 bg-gray-800/50 p-3 text-white placeholder-gray-400 focus:border-purple-500 focus:ring-purple-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                        <div class="text-sm">
                            <a th:href="@{/auth/forgot-password}" class="font-medium text-purple-400 hover:text-purple-300 hover:underline">
                                Forgot password?
                            </a>
                        </div>
                    </div>
                    <div class="relative mt-1">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                               class="block w-full rounded-lg border border-gray-600 bg-gray-800/50 p-3 pr-10 text-white placeholder-gray-400 focus:border-purple-500 focus:ring-purple-500 sm:text-sm">

                        <button type="button" onclick="togglePasswordVisibility()"
                                class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-white focus:outline-none">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>

                            <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="flex w-full justify-center rounded-lg bg-purple-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-purple-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-600 transition-colors">
                Sign in
            </button>

            <p class="mt-10 text-center text-sm text-gray-400">
                Not a member?
                <a th:href="@{/auth/register}" class="font-semibold leading-6 text-purple-400 hover:text-purple-300 hover:underline">
                    Create an account
                </a>
            </p>
        </form>
    </div>
</div>

<div class="hidden lg:flex w-1/2 relative bg-gray-800 border-l border-gray-700/50 items-center justify-center overflow-hidden">
    <div class="absolute w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-3xl top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute w-[300px] h-[300px] bg-indigo-500/10 rounded-full blur-2xl top-10 right-10"></div>

    <div class="relative z-10 text-center p-12">
        <div class="mb-8 flex justify-center">
            <svg class="h-20 w-20 text-purple-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
        </div>
        <h2 class="text-4xl font-bold text-white mb-6">Monitor with Confidence</h2>
        <p class="text-gray-400 text-lg max-w-md mx-auto">
            Real-time insights, instant alerts, and comprehensive uptime tracking for your critical infrastructure.
        </p>
    </div>
</div>

</body>
<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.add('hidden');
            eyeSlashIcon.classList.remove('hidden');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('hidden');
            eyeSlashIcon.classList.add('hidden');
        }
    }
</script>
</html>
