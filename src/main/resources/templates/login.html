<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-content}"></head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen">

<div class="bg-gray-800/50 p-8 rounded-xl shadow-lg border border-gray-700/50 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
        <p class="text-gray-400">Sign in to access your dashboard</p>
    </div>

    <div th:if="${successMessage}" class="mb-4 p-3 bg-green-900/50 border border-green-800 text-green-300 rounded-lg text-sm">
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${param.error}" class="mb-4 p-3 bg-red-900/50 border border-red-800 text-red-300 rounded-lg text-sm">
        Invalid email or password.
    </div>

    <form th:action="@{/auth/login}" method="post" class="space-y-6">
        <div>
            <label for="username" class="block mb-2 text-sm font-medium text-gray-300">Email</label>
            <input type="email" id="username" name="username" required
                   class="bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5">
        </div>

        <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-300">Password</label>
            <input type="password" id="password" name="password" required
                   class="bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5">
        </div>

        <button type="submit" class="w-full text-white bg-purple-600 hover:bg-purple-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors">
            Sign In
        </button>
    </form>

    <p class="mt-6 text-sm text-center text-gray-400">
        New here? <a th:href="@{/auth/register}" class="text-purple-400 hover:underline">Create an account</a>
    </p>
</div>

</body>
</html>
