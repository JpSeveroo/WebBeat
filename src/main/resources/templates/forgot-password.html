<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-content}"></head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex">

<div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-gray-900">
    <div class="w-full max-w-md space-y-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">Reset your password</h2>
            <p class="mt-2 text-sm text-gray-400">
                Enter your email address and we'll send you a link to reset your password.
            </p>
        </div>

        <form class="mt-8 space-y-6" th:action="@{/auth/forgot-password}" method="POST">

            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">Email address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                               class="block w-full rounded-lg border border-gray-600 bg-gray-800/50 p-3 text-white placeholder-gray-400 focus:border-purple-500 focus:ring-purple-500 sm:text-sm">
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="flex w-full justify-center rounded-lg bg-purple-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-purple-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-purple-600 transition-colors">
                Send Reset Link
            </button>

            <div class="text-center">
                <a th:href="@{/auth/login}" class="text-sm font-medium text-purple-400 hover:text-purple-300 hover:underline">
                    Back to Login
                </a>
            </div>
        </form>
    </div>
</div>

<div class="hidden lg:flex w-1/2 relative bg-gray-800 border-l border-gray-700/50 items-center justify-center overflow-hidden">
    <div class="absolute w-[500px] h-[500px] bg-purple-600/20 rounded-full blur-3xl -top-20 -right-20"></div>
    <div class="absolute w-[300px] h-[300px] bg-blue-600/10 rounded-full blur-2xl bottom-10 left-10"></div>

    <div class="relative z-10 text-center p-12">
        <h2 class="text-3xl font-bold text-white mb-4">Secure Access</h2>
        <p class="text-gray-400 max-w-sm mx-auto">
            Recover access to your WebBeat dashboard and get back to monitoring your critical services in seconds.
        </p>
    </div>
</div>

</body>
</html>
