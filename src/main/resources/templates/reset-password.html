<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-content}"></head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex">

<div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-gray-900">
    <div class="w-full max-w-md space-y-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">Set new password</h2>
            <p class="mt-2 text-sm text-gray-400">
                Please create a strong password to secure your account.
            </p>
        </div>

        <form class="mt-8 space-y-6" th:action="@{/auth/reset-password}" method="POST">

            <input type="hidden" name="token" th:value="${token}" />

            <div class="space-y-4">
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-300">New Password</label>
                    <div class="mt-1">
                        <input id="newPassword" name="newPassword" type="password" required
                               class="block w-full rounded-lg border border-gray-600 bg-gray-800/50 p-3 text-white placeholder-gray-400 focus:border-purple-500 focus:ring-purple-500 sm:text-sm">
                    </div>
                </div>
            </div>

            <button type="submit"
                    class="flex w-full justify-center rounded-lg bg-green-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-green-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-600 transition-colors">
                Change Password
            </button>
        </form>
    </div>
</div>

<div class="hidden lg:flex w-1/2 relative bg-gray-800 border-l border-gray-700/50 items-center justify-center overflow-hidden">
    <div class="absolute w-[500px] h-[500px] bg-green-600/10 rounded-full blur-3xl -bottom-20 -right-20"></div>
    <div class="relative z-10 text-center p-12">
        <div class="inline-flex items-center justify-center p-4 bg-green-900/30 rounded-full mb-6 text-green-400">
            <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        </div>
        <h2 class="text-3xl font-bold text-white mb-2">Password Security</h2>
        <p class="text-gray-400 max-w-sm mx-auto">
            Your security is our priority. Once changed, your old password will be invalidated immediately.
        </p>
    </div>
</div>

</body>
</html>
