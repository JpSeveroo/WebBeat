<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head-content}"></head>

<body class="bg-gray-900 text-gray-200 flex min-h-screen">

<div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

<main class="flex-1 p-8 overflow-y-auto">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-white">Dashboard</h2>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="text-sm text-red-400 hover:text-red-300 border border-red-900/50 px-3 py-1 rounded bg-red-900/20">
                Logout
            </button>
        </form>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-gray-800/50 rounded-xl p-6 flex items-center space-x-4 border border-gray-700/50">
            <div class="bg-purple-600/30 p-3 rounded-full"><svg class="h-6 w-6 text-purple-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg></div>
            <div>
                <p class="text-sm text-gray-400">Total URLs</p>
                <p class="text-2xl font-bold text-white">--</p>
            </div>
        </div>

        <div class="bg-gray-800/50 rounded-xl p-6 flex items-center space-x-4 border border-gray-700/50">
            <div class="bg-green-600/30 p-3 rounded-full"><svg class="h-6 w-6 text-green-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138z" /></svg></div>
            <div>
                <p class="text-sm text-gray-400">Uptime (24h)</p>
                <p class="text-2xl font-bold text-white">100%</p>
            </div>
        </div>

        <div class="bg-gray-800/50 rounded-xl p-6 flex items-center space-x-4 border border-gray-700/50">
            <div class="bg-blue-600/30 p-3 rounded-full"><svg class="h-6 w-6 text-blue-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg></div>
            <div>
                <p class="text-sm text-gray-400">Services Online</p>
                <p class="text-2xl font-bold text-white">--</p>
            </div>
        </div>

        <div class="bg-gray-800/50 rounded-xl p-6 flex items-center space-x-4 border border-gray-700/50">
            <div class="bg-red-600/30 p-3 rounded-full"><svg class="h-6 w-6 text-red-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg></div>
            <div>
                <p class="text-sm text-gray-400">Alerts</p>
                <p class="text-2xl font-bold text-white">0</p>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-gray-800/50 rounded-xl shadow-lg border border-gray-700/50 p-6">
            <h4 class="text-lg font-bold text-white mb-4">Uptime History</h4>
            <div class="h-64">
                <canvas id="uptimeChart"></canvas>
            </div>
        </div>
        <div class="bg-gray-800/50 rounded-xl shadow-lg border border-gray-700/50 p-6">
            <h4 class="text-lg font-bold text-white mb-4">Service Status</h4>
            <div class="h-64 flex items-center justify-center">
                <canvas id="statusChart" style="max-width: 280px;"></canvas>
            </div>
        </div>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Default Colors
        Chart.defaults.color = '#9ca3af';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';

        // 1. Uptime Chart (Dummy Data)
        const uptimeCtx = document.getElementById('uptimeChart');
        if (uptimeCtx) {
            new Chart(uptimeCtx, {
                type: 'line',
                data: {
                    labels: ['xx', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: '% Uptime',
                        data: [98, 100, 100, 99, 100, 100, 100],
                        fill: true,
                        backgroundColor: 'rgba(139, 92, 246, 0.2)',
                        borderColor: 'rgba(167, 139, 250, 1)',
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        // 2. Status Chart (Dummy Data)
        const statusCtx = document.getElementById('statusChart');
        if (statusCtx) {
            new Chart(statusCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Online', 'Offline'],
                    datasets: [{
                        data: [10, 2],
                        backgroundColor: ['rgba(34, 197, 94, 0.7)', 'rgba(239, 68, 68, 0.7)'],
                        borderColor: ['#22c55e', '#ef4444'],
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }
    });
</script>
</body>
</html>
