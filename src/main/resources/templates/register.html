<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head-content}"></head>
<body class="bg-gray-900 text-gray-200 flex items-center justify-center min-h-screen">

<div class="bg-gray-800/50 p-8 rounded-xl shadow-lg border border-gray-700/50 w-full max-w-md">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Create Account</h1>
        <p class="text-gray-400">Join WebBeat monitoring today</p>
    </div>

    <div th:if="${errorMessage}" class="mb-4 p-3 bg-red-900/50 border border-red-800 text-red-300 rounded-lg text-sm">
        <span th:text="${errorMessage}"></span>
    </div>

    <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="space-y-6">
        <div>
            <label for="email" class="block mb-2 text-sm font-medium text-gray-300">Email</label>
            <input type="email" id="email" th:field="*{email}" required
                   class="bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5">
        </div>

        <div>
            <label for="password" class="block mb-2 text-sm font-medium text-gray-300">Password</label>
            <input type="password" id="password" th:field="*{password}" required
                   class="bg-gray-700/50 border border-gray-600 text-white text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full p-2.5">
        </div>

        <button type="submit" class="w-full text-white bg-green-600 hover:bg-green-700 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-colors">
            Sign Up
        </button>
    </form>

    <p class="mt-6 text-sm text-center text-gray-400">
        Already have an account? <a th:href="@{/auth/login}" class="text-purple-400 hover:underline">Login here</a>
    </p>
</div>

</body>
</html>
